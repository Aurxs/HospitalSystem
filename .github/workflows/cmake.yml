name: CMake Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ncurses

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install pdcurses:x64-windows
          vcpkg integrate install

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake_args="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $cmake_args

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HospitalSystem-Windows
          path: build/Release/HospitalSystem.exe

      - name: Upload Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HospitalSystem-${{ runner.os }}
          path: build/HospitalSystem
