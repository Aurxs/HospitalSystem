name: Build Hospital System

on:
  push:
    branches: [ "main", "master", "tui" ]
  pull_request:
    branches: [ "main", "master", "tui" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      # --- Linux Dependencies ---
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev cmake build-essential

      # --- macOS Dependencies ---
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          # macOS usually has ncurses, but we can ensure it
          brew install ncurses

      # --- Windows Dependencies (vcpkg) ---
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          vcpkg install pdcurses:x64-windows

      # --- Configure CMake (Windows) ---
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      # --- Configure CMake (Non-Windows) ---
      - name: Configure CMake (Non-Windows)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # --- Build ---
      - name: Build
        run: cmake --build build --config Release

      # --- Upload Artifacts ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HospitalSystem-${{ matrix.os }}
          path: |
            build/HospitalSystem
            build/HospitalSystem.exe
            build/Release/HospitalSystem.exe
            build/RunTest
            build/RunTest.exe
            build/Release/RunTest.exe
          if-no-files-found: ignore
